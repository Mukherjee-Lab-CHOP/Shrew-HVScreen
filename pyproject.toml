[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrew-hvscreen"
version = "0.1.0"
description = "High-speed visual stimulus display system for Shrew behavioral experiments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mukherjee Lab", email = "lab@chop.edu"}
]
keywords = ["behavioral-neuroscience", "stimulus-display", "arduino", "pygame"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "pygame>=2.1",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.0.200",
]

[project.urls]
Homepage = "https://github.com/Mukherjee-Lab-CHOP/Shrew-HVScreen"
Repository = "https://github.com/Mukherjee-Lab-CHOP/Shrew-HVScreen"
Issues = "https://github.com/Mukherjee-Lab-CHOP/Shrew-HVScreen/issues"

[tool.uv]
python-preference = "managed"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W"]

[tool.hatch.build.targets.wheel]
packages = ["gui"]
